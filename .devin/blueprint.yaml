initialize: |
  set -euo pipefail
  test "$(uname -sm)" = "Linux x86_64"
  for tool in make curl tar xz sha256sum awk; do command -v "$tool" >/dev/null; done
  go_version="$(awk '$1 == "go" { print $2 }' backend/go.mod)"
  node_version="$(cat frontend/.nvmrc)"
  [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
  [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
  go_root="$HOME/.local/toolchains/go-$go_version"
  node_root="$HOME/.local/toolchains/node-$node_version"
  mkdir -p "$HOME/.local/bin" "$go_root" "$node_root"
  curl -fsSL "https://go.dev/dl/go$go_version.linux-amd64.tar.gz" -o "$HOME/.local/toolchains/go.tar.gz"
  printf '%s  %s\n' 'ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5' "$HOME/.local/toolchains/go.tar.gz" | sha256sum -c -
  tar -xzf "$HOME/.local/toolchains/go.tar.gz" -C "$go_root" --strip-components=1
  curl -fsSL "https://nodejs.org/dist/v$node_version/node-v$node_version-linux-x64.tar.xz" -o "$HOME/.local/toolchains/node.tar.xz"
  printf '%s  %s\n' '3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651' "$HOME/.local/toolchains/node.tar.xz" | sha256sum -c -
  tar -xJf "$HOME/.local/toolchains/node.tar.xz" -C "$node_root" --strip-components=1
  ln -sf "$go_root/bin/go" "$HOME/.local/bin/go"
  ln -sf "$go_root/bin/gofmt" "$HOME/.local/bin/gofmt"
  ln -sf "$node_root/bin/node" "$HOME/.local/bin/node"
  ln -sf "$node_root/bin/npm" "$HOME/.local/bin/npm"
  ln -sf "$node_root/bin/npx" "$HOME/.local/bin/npx"
  export PATH="$HOME/.local/bin:$PATH"
  test "$(go env GOVERSION)" = "go$go_version"
  test "$(node --version)" = "v$node_version"
  expected_npm="$(node -p "require('./frontend/package.json').packageManager.replace(/^npm@/, '')")"
  test "$(npm --version)" = "$expected_npm"
  printf 'PATH=%s\n' "$PATH" >> "$ENVRC"
  go version
  node --version
  npm --version

maintenance: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  (cd backend && go mod download)
  (cd frontend && npm install && npx playwright install --with-deps chromium)

knowledge:
  - name: lint
    contents: make check
  - name: test
    contents: make test && make test-e2e
  - name: build
    contents: make build
  - name: startup
    contents: Run make dev-backend and make dev-frontend in separate terminals.
  - name: notes
    contents: Read AGENTS.md for policy, README.md for setup and commands, and docs/workflow.md for environment operations.
